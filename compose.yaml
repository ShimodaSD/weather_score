services:
  frontend:
    image: node:24-alpine
    working_dir: /app/apps/web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && API_PROXY_TARGET=http://backend:8002 pnpm dev --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./workspace/docker/frontend_modules:/app/apps/web/node_modules
      - ./workspace/docker/frontend_store:/app/.pnpm-store

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app/apps/api
    command: uv run --frozen --extra garmin uvicorn main:app --host 0.0.0.0 --port 8002
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      GARMINDB_PATH: /app/workspace/garmin/HealthData/DBs/garmin_activities.db
      GARMINDB_CONFIG: /app/GarminConnectConfig.json
      GARMINDB_BOOTSTRAP_PATH: ""
      UV_LINK_MODE: copy
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    volumes:
      - .:/app
      - ./workspace/docker/backend_venv:/app/.venv
      - ./workspace/garmin/.GarminDb:/root/.GarminDb

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      DB_NAME_GARMIN: ${DB_NAME_GARMIN:?Set DB_NAME_GARMIN in .env}
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
      - ./docker/init-garmin-db.sh:/docker-entrypoint-initdb.d/init-garmin-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
