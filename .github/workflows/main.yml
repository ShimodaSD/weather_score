
name: Trigger OpenBot

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-openbot:
    if: github.event.review.user.login == 'chatgpt-codex-connector'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger OpenBot routine
        env:
          WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body --show-error \
            --retry 3 \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":\"$REPO\",\"pr_number\":\"$PR_NUMBER\",\"pr_url\":\"$PR_URL\"}"
