
name: Sync Codex Reviews to OpenBot

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  notify-openbot:
    if: >-
      github.event.repository.full_name == 'ShimodaSD/weather_score' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      github.event.sender.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify OpenBot
        env:
          OPENBOT_WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          OPENBOT_WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 scripts/notify_openbot.py
