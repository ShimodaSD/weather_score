
name: Sync PR Updates to OpenBot

on:
  pull_request_target:
    types: [synchronize]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  notify-openbot:
    if: >-
      github.event.repository.full_name == 'ShimodaSD/weather_score' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.action == 'synchronize' &&
        github.event.pull_request.state == 'open') ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
        github.event.sender.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify OpenBot
        env:
          OPENBOT_WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          OPENBOT_WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 scripts/notify_openbot.py
